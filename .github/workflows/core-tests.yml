name: Teaching application tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -B -X utf8 smart_hand/host/run_core_tests.py
      - run: python -B -X utf8 smart_hand/host/check_maix_deploy.py --expected-mode yolo11
